<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" role="img"
     aria-label="Verification summary: eight quarters analyzed; 28 of 32 sales bridges reconcile independently, and 4 additional checks require caveats; a 5-level evidence classification; 16 comparability issues logged.">
  <style>
    svg { --ink:#1a1a1a; --ink-2:#6b6b6b; --grid:#e5e5e5; }
    @media (prefers-color-scheme: dark) { svg { --ink:#ededed; --ink-2:#a3a3a3; --grid:#333333; } }
    .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .num { font-size:28px; font-weight:600; fill:var(--ink); }
    .cap1 { font-size:11px; fill:var(--ink-2); }
    .cap { font-size:10px; fill:var(--ink-2); }
  </style>
  <g class="t">
    <text class="num" x="116.0" y="46" text-anchor="middle">8</text><text class="cap1" x="116.0" y="68" text-anchor="middle">quarters analyzed</text><text class="cap1" x="116.0" y="82" text-anchor="middle">Q3 2024 – Q2 2026</text><text class="num" x="292.0" y="46" text-anchor="middle">28 / 32</text><text class="cap1" x="292.0" y="68" text-anchor="middle">sales bridges reconcile</text><text class="cap1" x="292.0" y="82" text-anchor="middle">independently</text><text class="num" x="468.0" y="46" text-anchor="middle">5-level</text><text class="cap1" x="468.0" y="68" text-anchor="middle">evidence</text><text class="cap1" x="468.0" y="82" text-anchor="middle">classification</text><text class="num" x="644.0" y="46" text-anchor="middle">16</text><text class="cap1" x="644.0" y="68" text-anchor="middle">comparability issues</text><text class="cap1" x="644.0" y="82" text-anchor="middle">logged</text><line x1="204.0" x2="204.0" y1="18" y2="90" stroke="var(--grid)"/><line x1="380.0" x2="380.0" y1="18" y2="90" stroke="var(--grid)"/><line x1="556.0" x2="556.0" y1="18" y2="90" stroke="var(--grid)"/>
    <g data-claude-anchor="caption" class="x-caption">
      <text class="cap" x="28" y="110">28 / 32: 4 additional checks require caveats: 3 use back-solved prior-year values; 1 depends on a component disclosed only as "$3.1B".</text>
      <text class="cap" x="28" y="123">Evidence classification: sourced · derived · back-solved · not collected · not disclosed.</text>
      <text class="cap" x="28" y="136">A bridge is Caterpillar's own disclosed volume, price realization, currency and inter-segment components tested against its</text>
      <text class="cap" x="28" y="149">reported sales change, for three segments and the consolidated total across eight quarters.</text>
      <text class="cap" x="28" y="162">Reconciliation demonstrates internal consistency with those components, not that the right line items were chosen.</text>
    </g>
  </g>
</svg>