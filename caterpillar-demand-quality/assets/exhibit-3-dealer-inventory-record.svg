<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" role="img"
     aria-label="Disclosed dealer-inventory change by quarter. The Construction Industries build collapsed from 1.5 billion dollars in Q1 2026 to 400 million in Q2 2026.">
  <style>
    svg { --ink:#1a1a1a; --ink-2:#6b6b6b; --data-muted:#b5b5b5;
          --accent:#2563eb; --grid:#e5e5e5; --axis:#999999; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#ededed; --ink-2:#a3a3a3; --data-muted:#777777;
            --accent:#60a5fa; --grid:#333333; --axis:#666666; }
    }
    .t   { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ttl { font-size:16px; font-weight:600; fill:var(--ink); }
    .sub { font-size:12px; fill:var(--ink-2); }
    .ax  { font-size:11px; fill:var(--ink-2); }
    .val { font-size:11px; fill:var(--ink); }
    .big { font-size:13px; font-weight:600; fill:var(--accent); }
    .src { font-size:10px; fill:var(--ink-2); }
    .nd  { font-size:10px; fill:var(--ink-2); }
  </style>
  <defs>
    <pattern id="nohatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="var(--axis)" stroke-width="1.6"/>
    </pattern>
    <marker id="arw" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L6 4 L0 7 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <g class="t">
    <text class="ttl" x="28" y="30">Construction Industries dealer build collapsed from $1.5B to $0.4B in Q2 2026</text>
    <text class="sub" x="28" y="52">Disclosed dealer-inventory change. Every quarter has two slots; a hatched stub means that figure was never disclosed.</text>

    <!-- gridlines -->
    <line x1="64" x2="740" y1="112.1" y2="112.1" stroke="var(--grid)"/>
    <line x1="64" x2="740" y1="172.7" y2="172.7" stroke="var(--grid)"/>
    <line x1="64" x2="740" y1="293.7" y2="293.7" stroke="var(--grid)"/>
    <line x1="64" x2="740" y1="233.2" y2="233.2" stroke="var(--axis)" stroke-width="1.5"/>
    <text class="ax" x="56" y="116"   text-anchor="end">+$2B</text>
    <text class="ax" x="56" y="176.7" text-anchor="end">+$1B</text>
    <text class="ax" x="56" y="237"   text-anchor="end">0</text>
    <text class="ax" x="56" y="297.7" text-anchor="end">−$1B</text>

    <!-- UNDISCLOSED SLOTS: company-wide Q3 24, Q2 25, Q3 25, Q2 26 -->
    <g opacity="0.55">
      <rect x="78.25"  y="227.2" width="26" height="12" fill="url(#nohatch)"/>
      <rect x="331.75" y="227.2" width="26" height="12" fill="url(#nohatch)"/>
      <rect x="416.25" y="227.2" width="26" height="12" fill="url(#nohatch)"/>
      <rect x="669.75" y="227.2" width="26" height="12" fill="url(#nohatch)"/>
      <!-- UNDISCLOSED SLOTS: Construction Industries Q3 24 - Q4 25 -->
      <rect x="108.25" y="227.2" width="26" height="12" fill="url(#nohatch)"/>
      <rect x="192.75" y="227.2" width="26" height="12" fill="url(#nohatch)"/>
      <rect x="277.25" y="227.2" width="26" height="12" fill="url(#nohatch)"/>
      <rect x="361.75" y="227.2" width="26" height="12" fill="url(#nohatch)"/>
      <rect x="446.25" y="227.2" width="26" height="12" fill="url(#nohatch)"/>
      <rect x="530.75" y="227.2" width="26" height="12" fill="url(#nohatch)"/>
    </g>

    <!-- Q4 2024 company-wide −1,300 -->
    <rect x="162.75" y="233.2" width="26" height="78.6" fill="var(--data-muted)"/>
    <text class="val" x="175.75" y="326" text-anchor="middle">−$1.3B</text>

    <!-- Q1 2025 company-wide +100 -->
    <rect x="247.25" y="227.1" width="26" height="6.1" fill="var(--data-muted)"/>
    <text class="val" x="260.25" y="219" text-anchor="middle">+$0.1B</text>

    <!-- Q4 2025 company-wide: DISCLOSED FLAT. Solid rule, deliberately unlike a hatched stub. -->
    <rect x="500.75" y="231.2" width="26" height="4" fill="var(--ink-2)"/>
    <text class="val" x="513.75" y="224" text-anchor="middle">0</text>
    <text class="nd"  x="513.75" y="253" text-anchor="middle">disclosed flat</text>

    <!-- Q1 2026 company-wide +2,000 and CI +1,500 -->
    <rect x="585.25" y="112.1" width="26" height="121.1" fill="var(--data-muted)"/>
    <text class="val" x="598.25" y="105" text-anchor="middle">+$2.0B</text>
    <rect x="615.25" y="142.4" width="26" height="90.8" fill="var(--accent)"/>
    <text class="big" x="632" y="134" text-anchor="middle">+$1.5B</text>

    <!-- Q2 2026 CI +400 -->
    <rect x="699.75" y="208.9" width="26" height="24.3" fill="var(--accent)"/>
    <text class="big" x="714" y="200" text-anchor="middle">+$0.4B</text>

    <!-- connector: the collapse, made legible without touching the axis -->
    <path d="M 652 138 Q 683 152 710 191" fill="none" stroke="var(--accent)"
          stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arw)" opacity="0.9"/>

    <!-- x axis labels -->
    <text class="ax" x="106.25" y="352" text-anchor="middle">Q3 24</text>
    <text class="ax" x="190.75" y="352" text-anchor="middle">Q4 24</text>
    <text class="ax" x="275.25" y="352" text-anchor="middle">Q1 25</text>
    <text class="ax" x="359.75" y="352" text-anchor="middle">Q2 25</text>
    <text class="ax" x="444.25" y="352" text-anchor="middle">Q3 25</text>
    <text class="ax" x="528.75" y="352" text-anchor="middle">Q4 25</text>
    <text class="ax" x="613.25" y="352" text-anchor="middle">Q1 26</text>
    <text class="ax" x="697.75" y="352" text-anchor="middle">Q2 26</text>

    <!-- legend -->
    <rect x="64"  y="378" width="12" height="12" fill="var(--data-muted)"/>
    <text class="ax" x="82" y="388">Company-wide</text>
    <rect x="186" y="378" width="12" height="12" fill="var(--accent)"/>
    <text class="ax" x="204" y="388">Construction Industries</text>
    <rect x="356" y="378" width="12" height="12" fill="url(#nohatch)" opacity="0.55"/>
    <text class="ax" x="374" y="388">Not disclosed — not zero</text>

    <text class="nd" x="64" y="406">Scope changes mid-series: segment-level dollars exist only for Q1 and Q2 2026.</text>
    <text class="nd" x="64" y="420">Q1 2026 is the only quarter carrying both figures, where the CI build is 75% of the company-wide build.</text>
    <text class="src" x="64" y="444">Caterpillar quarterly earnings releases; Q1 and Q2 2026 Forms 10-Q, accessions 0000018230-26-000021 and -000046</text>
  </g>
</svg>
