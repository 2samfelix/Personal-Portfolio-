<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 440" width="848" height="440" role="img" aria-label="FP&amp;A Intelligence Engine: load and validate, calculate and reconcile, package, then the AI writes and code checks.">
  <rect width="848" height="440" fill="#f5f1e6"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="78" font-size="30" font-weight="800" fill="#2a2820">FP&amp;A Intelligence Engine</text>
    <text x="48" y="114" font-size="19" fill="#5b5847">The AI writes the brief. Code does the math and decides</text>
    <text x="48" y="140" font-size="19" fill="#5b5847">whether the writing is accepted.</text>
    <g stroke-width="2">
      <rect x="48"  y="190" width="160" height="170" rx="14" fill="#ffffff" stroke="#1e3a2b" stroke-opacity="0.18"/>
      <rect x="244" y="190" width="160" height="170" rx="14" fill="#ffffff" stroke="#1e3a2b" stroke-opacity="0.18"/>
      <rect x="440" y="190" width="160" height="170" rx="14" fill="#ffffff" stroke="#1e3a2b" stroke-opacity="0.18"/>
      <rect x="636" y="190" width="164" height="170" rx="14" fill="#e8ebe5" stroke="#1e3a2b" stroke-opacity="0.35"/>
    </g>
    <g fill="#1e3a2b">
      <circle cx="80" cy="224" r="17"/><circle cx="276" cy="224" r="17"/><circle cx="472" cy="224" r="17"/><circle cx="668" cy="224" r="17"/>
    </g>
    <g font-size="16" font-weight="700" fill="#f5f1e6" text-anchor="middle">
      <text x="80" y="230">1</text><text x="276" y="230">2</text><text x="472" y="230">3</text><text x="668" y="230">4</text>
    </g>
    <g font-size="20" font-weight="700" fill="#2a2820">
      <text x="64" y="282">Load and</text><text x="64" y="308">validate</text>
      <text x="260" y="282">Calculate and</text><text x="260" y="308">reconcile</text>
      <text x="456" y="282">Package</text>
      <text x="652" y="282">Write, then</text><text x="652" y="308">check</text>
    </g>
    <g font-size="13" font-weight="600" fill="#96703e" letter-spacing="1">
      <text x="64" y="344">CODE</text><text x="260" y="344">CODE</text><text x="456" y="344">CODE</text><text x="652" y="330">AI WRITES ·</text><text x="652" y="348">CODE CHECKS</text>
    </g>
    <g fill="none" stroke="#1e3a2b" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M214 275 H238 M231 268 L238 275 L231 282"/>
      <path d="M410 275 H434 M427 268 L434 275 L427 282"/>
      <path d="M606 275 H630 M623 268 L630 275 L623 282"/>
    </g>
  </g>
