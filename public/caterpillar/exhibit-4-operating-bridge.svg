<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" role="img"
     aria-label="Construction Industries sales change by component, eight quarters. Volume produces the 2026 growth; price realization turns positive only in 2026.">
  <style>
    svg { --ink:#1a1a1a; --ink-2:#6b6b6b; --data-muted:#b5b5b5;
          --accent:#2563eb; --grid:#e5e5e5; --axis:#999999; }
    .t  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ttl{ font-size:16px; font-weight:600; fill:var(--ink); }
    .sub{ font-size:12px; fill:var(--ink-2); }
    .ax { font-size:11px; fill:var(--ink-2); }
    .note{ font-size:11px; fill:var(--ink-2); }
    .inbar{ font-size:11px; font-weight:600; fill:#ffffff; }
    .cap{ font-size:10px; fill:var(--ink-2); }
  </style>
  <g class="t">
