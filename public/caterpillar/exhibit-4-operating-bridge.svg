680.8 110.3 L 675.2 115.8 L 669.8 110.3 Z" fill="var(--ink)"/>
    <text class="inbar" x="593.8" y="197.6" text-anchor="middle">+1,459</text><text class="inbar" x="675.2" y="188.9" text-anchor="middle">+1,755</text>
    <line x1="565.8" x2="527.8" y1="140.6" y2="140.6" stroke="var(--ink-2)" stroke-width="1"/><text class="note" x="523.8" y="136.6" text-anchor="end">first positive price</text><text class="note" x="523.8" y="149.6" text-anchor="end">realization in the series</text>
    <text class="ax" x="104.8" y="340" text-anchor="middle">Q3 24</text><text class="ax" x="186.2" y="340" text-anchor="middle">Q4 24</text><text class="ax" x="267.8" y="340" text-anchor="middle">Q1 25</text><text class="ax" x="349.2" y="340" text-anchor="middle">Q2 25</text><text class="ax" x="430.8" y="340" text-anchor="middle">Q3 25</text><text class="ax" x="512.2" y="340" text-anchor="middle">Q4 25</text><text class="ax" x="593.8" y="340" text-anchor="middle">Q1 26</text><text class="ax" x="675.2" y="340" text-anchor="middle">Q2 26</text>
    <rect x="64" y="362" width="14" height="11" fill="var(--accent)" fill-opacity="0.85"/>
    <text class="ax" x="86" y="372">Volume</text>
    <rect x="160" y="362" width="14" height="11" fill="var(--data-muted)" fill-opacity="0.85"/>
    <text class="ax" x="182" y="372">Price realization</text>
    <rect x="296" y="362" width="14" height="11" fill="none" stroke="var(--data-muted)" stroke-width="1.3"/>
    <text class="ax" x="318" y="372">Currency</text>
    <path d="M 410 362 L 415.5 367.5 L 410 373 L 404.5 367.5 Z" fill="var(--ink)"/>
    <text class="ax" x="432" y="372">Net reported sales change</text>
    <g data-claude-anchor="caption" class="x-caption">
      <text class="cap" x="64" y="400">Inter-segment eliminations of $13–$40m a quarter are excluded for legibility, so the stacked components differ from the</text>
      <text class="cap" x="64" y="414">total diamond by that amount. This is a composition, not a reconciliation. All four components reconcile to the reported</text>
      <text class="cap" x="64" y="428">change with zero residual in the underlying workbook, across all eight quarters.</text>
      <text class="cap" x="64" y="446">Caterpillar quarterly earnings releases, Construction Industries segment sales bridges, Q3 2024 – Q2 2026</text>
    </g>
  </g>
</svg>